<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReliefFlow AI | History</title>
  <link rel="stylesheet" href="Css/style.css" />
</head>
<body onload="initApp(); loadHistory();">

  <aside class="sidebar">
    <div class="logo-box">
      <div class="logo">RF</div>
      <div>
        <h2>ReliefFlow</h2>
        <span>AI Allocation</span>
      </div>
    </div>

    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="resources.html">Resources</a>
      <a href="requests.html">Requests</a>
      <a href="allocation.html">Smart Allocation</a>
      <a href="history.html">History</a>
    </nav>

    <button class="logout-btn" onclick="logoutUser()">Logout</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>Allocation History</h1>
        <p>Track all completed smart allocations.</p>
      </div>

      <button class="danger-btn" onclick="clearHistory()">Clear History</button>
    </header>

    <section class="panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Request</th>
              <th>Resource</th>
              <th>Location</th>
              <th>AI Reason</th>
            </tr>
          </thead>
          <tbody id="historyTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="Js/app.js"></script>
</body>
</html>
