<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReliefFlow AI | Resources</title>
  <link rel="stylesheet" href="Css/style.css" />
</head>
<body onload="initApp(); loadResources();">

  <aside class="sidebar">
    <div class="logo-box">
      <div class="logo">RF</div>
      <div>
        <h2>ReliefFlow</h2>
        <span>AI Allocation</span>
      </div>
    </div>

    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="resources.html">Resources</a>
      <a href="requests.html">Requests</a>
      <a href="allocation.html">Smart Allocation</a>
      <a href="history.html">History</a>
    </nav>

    <button class="logout-btn" onclick="logoutUser()">Logout</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>Resource Management</h1>
        <p>Add, edit, delete and track resource availability.</p>
      </div>
    </header>

    <section class="panel form-panel">
      <h2 id="resourceFormTitle">Add Resource</h2>

      <div class="form-grid">
        <input type="hidden" id="resourceEditId" />

        <div class="input-group">
          <label>Resource Name</label>
          <input id="resourceName" placeholder="Ambulance A1 / ICU Bed 04" />
        </div>

        <div class="input-group">
          <label>Type</label>
          <select id="resourceType">
            <option>Ambulance</option>
            <option>Bed</option>
            <option>Food Kit</option>
            <option>Volunteer</option>
            <option>Shelter</option>
            <option>Lab</option>
            <option>Classroom</option>
            <option>Medicine</option>
          </select>
        </div>

        <div class="input-group">
          <label>Location</label>
          <select id="resourceLocation">
            <option>Zone A</option>
            <option>Zone B</option>
            <option>Zone C</option>
            <option>Zone D</option>
          </select>
        </div>

        <div class="input-group">
          <label>Capacity</label>
          <input type="number" id="resourceCapacity" placeholder="1" min="1" />
        </div>
      </div>

      <div class="actions">
        <button class="primary-btn" onclick="saveResource()">Save Resource</button>
        <button class="ghost-btn" onclick="resetResourceForm()">Clear</button>
      </div>
    </section>

    <section class="panel">
      <div class="table-head">
        <h2>Resource List</h2>
        <input class="search" id="resourceSearch" placeholder="Search resource..." oninput="loadResources()" />
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>Location</th>
              <th>Capacity</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="resourceTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="Js/app.js"></script>
</body>
</html>
